{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro - Tênis Panambi</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a,#06245c);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.box{
    background:white;
    width:450px;
    padding:38px;
    border-radius:24px;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.logo-area{
    text-align:center;
    margin-bottom:15px;
}

.logo-area img{
    max-width:150px;
    max-height:95px;
    object-fit:contain;
}

h1{
    text-align:center;
    color:#0b4d91;
    margin:10px 0 25px;
    font-size:32px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0b4d91;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#073b70;
}

.erro{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
}

.sucesso{
    background:#d4edda;
    color:#155724;
    padding:15px;
    border-radius:10px;
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}

.links{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    text-align:center;
    margin-top:22px;
}

.links a{
    color:#0b4d91;
    text-decoration:none;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

.link-home{
    background:#eef6ff;
    padding:12px;
    border-radius:10px;
}

.link-login{
    padding:8px;
}

@media(max-width:520px){
    .box{
        width:100%;
        padding:28px 22px;
    }
}
</style>
</head>

<body>

<div class="box">

    <div class="logo-area">
        <img src="{% static 'img/logo.png' %}" alt="Tênis Panambi">
    </div>

    <h1>Criar conta</h1>

    {% if sucesso %}
        <div class="sucesso">
            {{ sucesso }}
        </div>
    {% endif %}

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    {% if not sucesso %}

    <form method="post">
        {% csrf_token %}

        <input
            type="text"
            name="nome"
            placeholder="Nome completo"
            required
        >

        <input
            type="text"
            name="username"
            placeholder="Usuário para login"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="E-mail"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <input
            type="password"
            name="confirmar_senha"
            placeholder="Confirmar senha"
            required
        >

        <button type="submit">
            Enviar cadastro
        </button>
    </form>

    {% endif %}

    <div class="links">
        <a href="/" class="link-home">Ir para a página inicial</a>
        <a href="/login/" class="link-login">Voltar para o login</a>
    </div>

</div>

</body>
</html>
