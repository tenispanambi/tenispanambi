<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(
        135deg,
        #0b5394,
        #073763
    );

    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    background:white;
    width:380px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#0b5394;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#0b5394;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.logo{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

.erro{
    color:red;
    margin-bottom:15px;
    text-align:center;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        🎾
    </div>

    <h1>
        TenisPanambi
    </h1>

    {% if form.errors %}

        <div class="erro">
            Usuário ou senha inválidos
        </div>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Usuário"
        >

        <input
            type="password"
            name="password"
            placeholder="Senha"
        >

        <button type="submit">

            Entrar

        </button>

    </form>

</div>

</body>
</html>
