{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - TenisPanambi</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            width:400px;
            padding:40px;
            border-radius:20px;
            box-shadow:0 0 30px rgba(0,0,0,0.3);
        }

        h1{
            color:#0b4d91;
            text-align:center;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:15px;
            margin-bottom:20px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#0b4d91;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#08376a;
        }

        .logo{
            text-align:center;
            font-size:40px;
            margin-bottom:10px;
        }

    </style>

</head>
<body>

<div class="box">

    <div style="text-align:center;margin-bottom:20px;">

    <img 
        src="{% static 'img/logo.png' %}"
        style="
            width:180px;
            height:auto;
            object-fit:contain;
            margin-bottom:10px;
        "
    >

    <h1 style="
        color:#0b4d91;
        font-size:54px;
        margin:0;
        font-weight:900;
    ">
        </h1>

</div>

    <h1>Tênis Panambi</h1>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Usuário">

        <input type="password" name="password" placeholder="Senha">

        <button type="submit">
            Entrar
        </button>

        <div style="text-align:center; margin-top:20px;">
    <a href="/cadastro/" style="
        color:#0b4d91;
        text-decoration:none;
        font-weight:bold;
    ">
        Criar conta
    </a>
</div>

    </form>

</div>

</body>
</html>
