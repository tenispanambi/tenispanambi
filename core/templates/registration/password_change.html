{% extends 'base/base.html' %}

{% block content %}

<div style="
max-width:650px;
margin:50px auto;
">

    <div style="
    background:white;
    border-radius:28px;
    padding:45px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    ">

        <h1 style="
        margin-top:0;
        color:#0b4d91;
        font-size:40px;
        text-align:center;
        ">
            🔒 Trocar Senha
        </h1>

        <p style="
        text-align:center;
        color:#64748b;
        margin-top:10px;
        margin-bottom:35px;
        font-size:18px;
        ">
            Altere sua senha de acesso ao sistema.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div style="margin-bottom:25px;">

                <label style="
                display:block;
                margin-bottom:10px;
                font-weight:bold;
                color:#0f172a;
                ">
                    Senha Atual
                </label>

                {{ form.old_password }}

            </div>

            <div style="margin-bottom:25px;">

                <label style="
                display:block;
                margin-bottom:10px;
                font-weight:bold;
                color:#0f172a;
                ">
                    Nova Senha
                </label>

                {{ form.new_password1 }}

            </div>

            <div style="margin-bottom:35px;">

                <label style="
                display:block;
                margin-bottom:10px;
                font-weight:bold;
                color:#0f172a;
                ">
                    Confirmar Nova Senha
                </label>

                {{ form.new_password2 }}

            </div>

            <button
                type="submit"
                style="
                width:100%;
                background:#0b4d91;
                color:white;
                border:none;
                padding:18px;
                border-radius:16px;
                font-size:18px;
                font-weight:bold;
                cursor:pointer;
                "
            >
                Salvar Nova Senha
            </button>

        </form>

    </div>

</div>

<style>

input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #dbe2ea;
    font-size:16px;
    outline:none;
}

input:focus{
    border:1px solid #0b4d91;
}

ul.errorlist{
    list-style:none;
    padding:0;
    margin:10px 0;
    color:#dc2626;
    font-weight:bold;
}

.helptext{
    display:block;
    margin-top:8px;
    color:#64748b;
    font-size:14px;
}

</style>

{% endblock %}
