{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tênis Panambi</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#eef2f7;
            overflow-x:hidden;
        }

        .topo{
            background:
                radial-gradient(circle at right, rgba(14,165,233,.55), transparent 35%),
                linear-gradient(135deg, #020617 0%, #061b4f 55%, #053b7a 100%);
            padding:20px 38px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:25px;
            box-shadow:0 8px 28px rgba(0,0,0,.22);
            border-bottom:1px solid rgba(255,255,255,.08);
            position:relative;
        }

        .logo-area{
            display:flex;
            align-items:center;
            gap:18px;
            min-width:330px;
        }

        .logo-area img{
            height:86px;
            width:auto;
            object-fit:contain;
            filter:drop-shadow(0 5px 12px rgba(0,0,0,.35));
        }

        .titulo-site{
            color:white;
            font-size:42px;
            font-weight:900;
            line-height:1;
            letter-spacing:-1px;
        }

        .subtitulo-site{
            color:#67e8f9;
            font-size:17px;
            margin-top:8px;
            font-weight:500;
        }

        .menu-toggle{
            display:none;
        }

        .menu-btn{
            display:none;
            color:white;
            background:rgba(255,255,255,.12);
            border:1px solid rgba(255,255,255,.25);
            width:48px;
            height:48px;
            border-radius:14px;
            align-items:center;
            justify-content:center;
            font-size:24px;
            cursor:pointer;
        }

        .menu{
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:8px;
            flex-wrap:wrap;
        }

        .menu a{
            color:white;
            text-decoration:none;
            font-weight:800;
            font-size:15px;
            white-space:nowrap;
            transition:.2s;
            padding:11px 13px;
            border-radius:14px;
        }

        .menu a:hover{
            background:rgba(255,255,255,.12);
            color:#d7ff00;
        }

        .btn-lancar{
            background:linear-gradient(135deg,#00d084,#22c55e) !important;
            color:#021526 !important;
            padding:13px 20px !important;
            box-shadow:0 8px 20px rgba(0,208,132,.28);
        }

        .usuario-dropdown{
            position:relative;
            display:inline-block;
            padding:8px 0;
        }

        .usuario{
            color:#d7ff00 !important;
            font-weight:900;
            display:flex;
            align-items:center;
            gap:8px;
        }

        .dropdown-menu{
            position:absolute;
            top:48px;
            right:0;
            background:white;
            min-width:210px;
            border-radius:16px;
            box-shadow:0 14px 35px rgba(0,0,0,.28);
            overflow:hidden;
            display:none;
            z-index:9999;
        }

        .usuario-dropdown:hover .dropdown-menu{
            display:block;
        }

        .dropdown-menu a{
            display:block;
            padding:14px 18px;
            color:#0b4d91 !important;
            text-decoration:none;
            font-weight:bold;
            font-size:15px;
            border-bottom:1px solid #e5e7eb;
            background:white;
            border-radius:0;
        }

        .dropdown-menu a:hover{
            background:#eef2ff;
        }

        .social-topo{
            display:flex;
            align-items:center;
            gap:10px;
            margin-left:8px;
        }

        .social-link{
            width:42px;
            height:42px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white !important;
            font-size:20px;
            text-decoration:none;
            transition:.25s;
            padding:0 !important;
        }

        .social-link:hover{
            transform:scale(1.1);
        }

        .instagram{
            background:linear-gradient(45deg,#f09433,#dc2743,#cc2366,#bc1888);
        }

        .youtube{
            background:#ff0000;
        }

        .conteudo{
            padding:35px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        img{
            max-width:100%;
        }

        @media(max-width:1150px){
            .topo{
                flex-wrap:wrap;
            }

            .logo-area{
                min-width:0;
            }

            .menu{
                width:100%;
                justify-content:center;
            }
        }

        @media(max-width:768px){

            .topo{
                padding:14px 12px;
                display:grid;
                grid-template-columns:1fr auto;
                align-items:center;
                gap:12px;
            }

            .logo-area{
                gap:10px;
                min-width:0;
            }

            .logo-area img{
                height:60px;
            }

            .titulo-site{
                font-size:26px;
            }

            .subtitulo-site{
                font-size:12px;
                margin-top:5px;
            }

            .menu-btn{
                display:flex;
            }

            .menu{
                display:none;
                grid-column:1 / -1;
                width:100%;
                background:rgba(2,6,23,.62);
                border:1px solid rgba(255,255,255,.12);
                border-radius:20px;
                padding:12px;
                margin-top:6px;
                grid-template-columns:1fr 1fr;
                gap:10px;
            }

            .menu-toggle:checked ~ .menu{
                display:grid;
            }

            .menu a,
            .usuario{
                display:flex;
                align-items:center;
                justify-content:center;
                min-height:48px;
                padding:12px 8px;
                border-radius:16px;
                background:rgba(255,255,255,.11);
                font-size:14px;
                text-align:center;
            }

            .btn-lancar{
                grid-column:1 / -1;
                font-size:16px !important;
            }

            .usuario-dropdown{
                grid-column:1 / -1;
                width:100%;
                padding:0;
            }

            .dropdown-menu{
                position:static;
                display:block;
                width:100%;
                margin-top:8px;
                border-radius:14px;
                box-shadow:none;
            }

            .dropdown-menu a{
                font-size:14px;
                padding:12px;
                color:#0b4d91 !important;
                background:white;
            }

            .social-topo{
                grid-column:1 / -1;
                justify-content:center;
                margin-left:0;
                margin-top:4px;
            }

            .social-link{
                width:42px;
                height:42px;
            }

            .conteudo{
                padding:12px;
            }

            h1{
                font-size:26px !important;
                line-height:1.2;
            }

            h2{
                font-size:22px !important;
                line-height:1.2;
            }

            h3{
                font-size:18px !important;
            }

            table{
                display:block;
                overflow-x:auto;
                white-space:nowrap;
                font-size:13px;
            }

            th,
            td{
                padding:8px !important;
            }

            input,
            select,
            textarea,
            button{
                max-width:100%;
                font-size:16px;
            }

            button,
            .btn{
                min-height:44px;
            }

            .conteudo > div{
                max-width:100% !important;
            }

            div[style*="grid-template-columns"]{
                grid-template-columns:1fr !important;
            }

            div[style*="display:flex"]{
                flex-wrap:wrap;
            }
        }
    </style>
</head>

<body>

<header class="topo">

    <div class="logo-area">
        <img src="{% static 'img/logo.png' %}" alt="Tênis Panambi">

        <div>
            <div class="titulo-site">
                Tênis Panambi
            </div>

            <div class="subtitulo-site">
                Ranking • Jogos • Torneios
            </div>
        </div>
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">

    <label for="menu-toggle" class="menu-btn">
        <i class="fa-solid fa-bars"></i>
    </label>

    <nav class="menu">

        <a href="/">
            <i class="fa-solid fa-house"></i> Início
        </a>

        <a href="/ranking/">
            <i class="fa-solid fa-chart-simple"></i> Ranking
        </a>

        <a href="/mural-campeoes/">
            <i class="fa-solid fa-trophy"></i> Campeões
        </a>

        <a href="/head-to-head/">
            <i class="fa-solid fa-circle-half-stroke"></i> Head to Head
        </a>

        {% if user.is_authenticated %}

            <a href="/meu-painel/">
                <i class="fa-solid fa-user"></i> Meu Painel
            </a>

            <a href="/meus-jogos/">
                <i class="fa-solid fa-calendar-days"></i> Meus Jogos
            </a>

            <a href="/lancar-jogo/" class="btn-lancar">
                <i class="fa-solid fa-plus"></i> Lançar Jogo
            </a>

            <div class="usuario-dropdown">

                <a href="#" class="usuario">
                    <i class="fa-solid fa-circle-user"></i> {{ user.username }}
                </a>

                <div class="dropdown-menu">
                    <a href="/meu-perfil/">Meu Perfil</a>
                    <a href="/password_change/">Trocar Senha</a>
                    <a href="/logout/">Sair</a>
                </div>

            </div>

        {% else %}

            <a href="/login/">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </a>

            <a href="/cadastro/">
                <i class="fa-solid fa-user-plus"></i> Criar Conta
            </a>

        {% endif %}

        <div class="social-topo">

            <a
                href="https://instagram.com/tenispanambi"
                target="_blank"
                class="social-link instagram"
            >
                <i class="fab fa-instagram"></i>
            </a>

            <a
                href="https://youtube.com/@tenispanambi"
                target="_blank"
                class="social-link youtube"
            >
                <i class="fab fa-youtube"></i>
            </a>

        </div>

    </nav>

</header>

<div class="conteudo">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
